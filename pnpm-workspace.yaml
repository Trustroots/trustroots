packages:
  - 'modules/*'

overrides:
  'node-forge': '1.4.0'
  'websocket-driver': '0.7.5'
  'nan': '2.28.0'
  'serialize-javascript': '7.0.5'
  'browserslist': '4.28.7'
  'baseline-browser-mapping': '2.11.0'
  'fast-uri': '3.1.8'
  'decode-uri-component': '0.5.0'
  'js-yaml@<5': '4.3.2'
  'brace-expansion@1': '1.1.21'
  'brace-expansion@2': '2.1.7'
  'brace-expansion@5': '5.0.12'
  'acl>mongodb': '4.17.2'
  'acl>redis': '3.1.1'
  'mongodb-core>bson': '1.1.6'
  'socks>ip-address': '10.7.1'
  'express>qs': '6.16.0'
  '@google-cloud/storage>gaxios': '7.2.0'
  '@google-cloud/storage>retry-request': '8.0.3'
  '@google-cloud/storage>teeny-request': '10.1.3'
