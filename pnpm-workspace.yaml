packages:
  - 'modules/*'
  - 'packages/*'

catalog:
  qs: '6.16.1'

overrides:
  'follow-redirects': '1.16.2'
  'minimatch@>=9': '11.0.3'
  'browserslist': '4.28.7'
  'baseline-browser-mapping': '2.11.0'
  'js-yaml@<5': '4.3.2'
  'brace-expansion@1': '1.1.21'
  'brace-expansion@2': '2.1.7'
  'brace-expansion@5': '5.0.12'
  'socks>ip-address': '10.7.4'
  'express>qs': 'catalog:'
  'body-parser@1': '1.20.9'
  'body-parser@2': '2.4.0'

patchedDependencies:
  '@agendajs/mongo-backend@4.0.3': patches/@agendajs__mongo-backend@4.0.3.patch
  'deepmerge@4.3.1': patches/deepmerge@4.3.1.patch

allowBuilds:
  '@parcel/watcher': true
  'unrs-resolver': true
  'core-js': false

peerDependencyRules:
  ignoreMissing:
    - eslint-import-resolver-webpack
    - webpack

saveExact: true
