packages:
  - 'modules/*'
  - 'packages/*'

catalog:
  qs: '6.17.1'

overrides:
  'follow-redirects': '1.16.2'
  '@joshwooding/vite-plugin-react-docgen-typescript@0.7.0>glob': '14.0.6'
  'minimatch@>=9': '11.0.3'
  'browserslist': '4.28.7'
  'baseline-browser-mapping': '2.11.0'
  'js-yaml@<5': '4.3.2'
  'brace-expansion@1': '1.1.21'
  'brace-expansion@2': '2.1.7'
  'brace-expansion@5': '5.0.12'
  'socks>ip-address': '10.7.4'
  'express>qs': 'catalog:'
  'typed-rest-client>qs': 'catalog:'
  'body-parser@1': '1.20.9'
  'body-parser@2': '2.4.0'

patchedDependencies:
  'i18next-cli@1.88.0': patches/i18next-cli@1.88.0.patch
  'picomatch@2.3.2': patches/picomatch@2.3.2.patch
  'picomatch@4.0.7': patches/picomatch@4.0.7.patch

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': false
  'esbuild': false

peerDependencyRules:
  ignoreMissing:
    - webpack

saveExact: true

fetchRetries: 5
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 120000
fetchTimeout: 600000
