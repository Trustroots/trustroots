<!doctype html>
<html lang="en">
  <head>
    {% include 'react-head.server.view.html' %} {% for cssFile in reactCssFiles
    %}
    <link rel="stylesheet" href="/{{cssFile}}?c={{appSettings.commit}}" />
    {% endfor %} {% for jsFile in reactJsFiles %}
    <script
      type="module"
      src="/{{jsFile}}?c={{appSettings.commit}}"
      nonce="{{ nonce }}"
    ></script>
    {% endfor %}
  </head>
  <body>
    {% block content %}{% endblock content %}
  </body>
</html>
