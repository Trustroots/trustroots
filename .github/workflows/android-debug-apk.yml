name: Android debug APK

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-debug-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check APK build request
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Android changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/apk-changed-files"
          if grep -Eq '^(apps/android/|\.github/workflows/android-debug-apk\.yml$)' "$RUNNER_TEMP/apk-changed-files"; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          else
            echo 'android=false' >> "$GITHUB_OUTPUT"
          fi
  debug-apk:
    name: Build debug APK
    needs: changes
    outputs:
      artifact-url: ${{ steps.apk.outputs.artifact-url }}
    if: >
      (github.event.action != 'labeled' || github.event.label.name == 'build-apk') &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'build-apk') ||
       needs.changes.outputs.android == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test, lint and build debug APK
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Record APK checksum
        run: sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trustroots-android-debug-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Link downloadable APK
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo "[Download debug APK and checksum]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  design-journeys:
    name: Android journeys and coverage
    timeout-minutes: 30
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test coverage reporting scripts
        run: python3 -m unittest discover -s apps/android/scripts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run API 36 journeys and unit coverage
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: bash apps/android/gradlew -p apps/android -Pkotlin.incremental=false -PtrustrootsCoverage=true -PtrustrootsApiUrl=http://127.0.0.1:38081 debugCoverageTable
      - name: Merge API 32 notification and WebView compatibility coverage
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 32
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: |
            bash apps/android/scripts/collect-legacy-coverage.sh
            bash apps/android/gradlew -p apps/android -Pkotlin.incremental=false -PtrustrootsCoverage=true -PtrustrootsApiUrl=http://127.0.0.1:38081 debugCoverageTable -x testDebugUnitTest -x connectedDebugAndroidTest -x compileDebugKotlin -x compileDebugJavaWithJavac
      - name: Enforce Android coverage ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          reference_args=()
          if [ -n "$BASE_SHA" ]; then
            git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:apps/android/coverage-baseline.json" 2>/dev/null; then
            git show "$BASE_SHA:apps/android/coverage-baseline.json" > "$RUNNER_TEMP/android-coverage-baseline.json"
            reference_args=(--reference "$RUNNER_TEMP/android-coverage-baseline.json")
          fi
          python3 apps/android/scripts/coverage-ratchet.py \
            apps/android/app/build/reports/coverage/debug/coverage.xml \
            apps/android/coverage-baseline.json "${reference_args[@]}"
      - name: Publish Android coverage table
        if: always()
        run: |
          if [ -f apps/android/app/build/reports/coverage/debug/coverage.md ]; then
            cat apps/android/app/build/reports/coverage/debug/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-design-test-results
          retention-days: 7
          path: |
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/outputs/code_coverage/debugAndroidTest/connected/api32/
            apps/android/app/build/reports/coverage/

  link-pr-apk:
    name: Link APK from PR
    needs: debug-apk
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Update APK download comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL: ${{ needs.debug-apk.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pull.head.sha !== process.env.HEAD_SHA) {
              core.notice('A newer commit is awaiting its APK build.');
              return;
            }
            const marker = '<!-- trustroots-pr-apk -->';
            const body = [
              marker,
              '## Android APK',
              '',
              `**[Download APK (ZIP)](${process.env.ARTIFACT_URL})**`,
              '',
              'Extract the ZIP and install `app-debug.apk`. It also contains the SHA-256 checksum.',
              '',
              `Built from \`${process.env.HEAD_SHA.slice(0, 7)}\` after Android unit tests and lint passed. The download is retained for 30 days.`,
              '',
              `[Build details](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
