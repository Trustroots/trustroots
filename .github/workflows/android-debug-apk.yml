name: Android debug APK

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/shared/**'
      - 'config/languages/languages.json'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-debug-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check APK build request
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Android changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/apk-changed-files"
          if grep -Eq '^(apps/android/|apps/shared/|config/languages/languages\.json$|\.github/workflows/android-debug-apk\.yml$)' "$RUNNER_TEMP/apk-changed-files"; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          else
            echo 'android=false' >> "$GITHUB_OUTPUT"
          fi
  debug-apk:
    name: Build debug APK
    needs: changes
    outputs:
      artifact-url: ${{ steps.apk.outputs.artifact-url }}
      debug-size: ${{ steps.size.outputs.debug-size }}
      release-size-report: ${{ steps.size.outputs.report }}
    if: >
      github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'build-apk') ||
       needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test, lint and build APKs
        working-directory: apps/android
        run: ./gradlew --build-cache testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Check out main for the APK size comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref == 'main' && github.event.pull_request.base.sha || 'main' }}
          path: apk-size-baseline
          persist-credentials: false
      - name: Build the release APK from main
        if: github.event_name == 'pull_request'
        working-directory: apk-size-baseline/apps/android
        run: ./gradlew --build-cache assembleRelease
      - name: Check release APK size
        id: size
        run: |
          apk_path=apps/android/app/build/outputs/apk
          release_apk="$apk_path/release/app-release-unsigned.apk"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            bash apps/android/scripts/check-apk-size.sh "$release_apk" "apk-size-baseline/$release_apk"
          else
            bash apps/android/scripts/check-apk-size.sh "$release_apk"
          fi
          echo "debug-size=$(stat -c '%s' "$apk_path/debug/app-debug.apk")" >> "$GITHUB_OUTPUT"
      - name: Record APK checksum
        run: sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trustroots-android-debug-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Link downloadable APK
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo "[Download debug APK and checksum]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  coverage-build:
    name: Build Android coverage inputs
    timeout-minutes: 30
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test coverage reporting scripts
        run: python3 -m unittest discover -s apps/android/scripts
      - name: Build coverage APKs and run unit tests before starting the emulator
        run: >-
          bash apps/android/gradlew -p apps/android --build-cache
          -PtrustrootsCoverage=true -PtrustrootsApiUrl=http://127.0.0.1:38081
          testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Package coverage inputs
        run: |
          tar -czf android-coverage-inputs.tar.gz -C apps/android/app/build \
            outputs/apk intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes \
            intermediates/javac/debug/compileDebugJavaWithJavac/classes \
            outputs/unit_test_code_coverage reports/tests test-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-coverage-inputs
          path: android-coverage-inputs.tar.gz
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  coverage-device:
    name: Android coverage (${{ matrix.target }})
    needs: coverage-build
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api36-0
            api: 36
            command: bash apps/android/scripts/collect-shard-coverage.sh 0
          - target: api36-1
            api: 36
            command: bash apps/android/scripts/collect-shard-coverage.sh 1
          - target: api32
            api: 32
            command: bash apps/android/scripts/collect-legacy-coverage.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-coverage-inputs
      - name: Restore shared APKs
        run: |
          mkdir -p apps/android/app/build
          tar -xzf android-coverage-inputs.tar.gz -C apps/android/app/build outputs/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device coverage
        id: device-coverage
        # The boot-health gate signals a known System UI failure before any tests start.
        # The final step propagates other failures from this attempt.
        continue-on-error: true
        env:
          ANDROID_EMULATOR_ATTEMPT: initial
          ANDROID_EMULATOR_PORT: '5554'
        uses: &emulator-runner reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with: &device-coverage-inputs
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 36 && env.ANDROID_EMULATOR_ATTEMPT == 'retry' && 'google_apis' || 'default' }}
          # Public ubuntu-latest runners have four vCPUs; leave enough CPU for
          # Android's System UI and launcher while the instrumentation suite runs.
          cores: 4
          disable-animations: true
          avd-name: coverage-${{ env.ANDROID_EMULATOR_ATTEMPT }}
          emulator-port: ${{ env.ANDROID_EMULATOR_PORT }}
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          force-avd-creation: true
          profile: pixel_6
          # Reduce API 36 software rendering load while retaining the Pixel 6 layout in dp.
          pre-emulator-launch-script: >-
            if [ "${{ matrix.api }}" = 36 ]; then
            config="$ANDROID_AVD_HOME/coverage-$ANDROID_EMULATOR_ATTEMPT.avd/config.ini";
            sed -i -e 's/^hw\.lcd\.width[[:space:]]*=.*/hw.lcd.width=720/'
            -e 's/^hw\.lcd\.height[[:space:]]*=.*/hw.lcd.height=1600/'
            -e 's/^hw\.lcd\.density[[:space:]]*=.*/hw.lcd.density=280/' "$config" &&
            grep -qx 'hw.lcd.width=720' "$config" &&
            grep -qx 'hw.lcd.height=1600' "$config" &&
            grep -qx 'hw.lcd.density=280' "$config";
            fi
          script: |
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put secure show_ime_with_hard_keyboard 1
            ANDROID_BOOT_RETRY_OUTPUT="$GITHUB_OUTPUT" bash apps/android/scripts/run-with-android-boot-health.sh apps/android/app/build/diagnostics/${{ matrix.target }}/"$ANDROID_EMULATOR_ATTEMPT" ${{ matrix.command }}
      - name: Retry device coverage on a fresh emulator
        if: steps.device-coverage.outcome == 'failure' && steps.device-coverage.outputs.retry_fresh_emulator == 'true'
        env:
          ANDROID_EMULATOR_ATTEMPT: retry
          ANDROID_EMULATOR_PORT: '5556'
        uses: *emulator-runner
        with: *device-coverage-inputs
      - name: Propagate device coverage failures
        if: steps.device-coverage.outcome == 'failure' && steps.device-coverage.outputs.retry_fresh_emulator != 'true'
        run: exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-device-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/android/app/build/outputs/code_coverage/
            apps/android/app/build/diagnostics/

  design-journeys:
    name: Android journeys and coverage
    # Keep this check name stable: main requires it before Android changes merge.
    needs: [changes, debug-apk, coverage-build, coverage-device]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.result != 'success' ||
       needs.changes.outputs.android == 'true')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Require Android build and coverage jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APK_RESULT: ${{ needs.debug-apk.result }}
          BUILD_RESULT: ${{ needs.coverage-build.result }}
          DEVICE_RESULT: ${{ needs.coverage-device.result }}
        run: >-
          test "$CHANGES_RESULT" = success && test "$APK_RESULT" = success &&
          test "$BUILD_RESULT" = success && test "$DEVICE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-coverage-inputs
      - name: Restore original classes and unit coverage
        run: |
          mkdir -p apps/android/app/build
          tar -xzf android-coverage-inputs.tar.gz -C apps/android/app/build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: android-device-*
          merge-multiple: true
          path: apps/android/app/build
      - name: Require every coverage input
        run: python3 apps/android/scripts/check-coverage-inputs.py apps/android/app/build
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Merge coverage without rebuilding classes
        run: >-
          bash apps/android/gradlew -p apps/android --build-cache
          -PtrustrootsCoverage=true -PtrustrootsApiUrl=http://127.0.0.1:38081
          debugCoverageTable -x testDebugUnitTest -x connectedDebugAndroidTest
          -x compileDebugKotlin -x compileDebugJavaWithJavac
      - name: Enforce Android coverage ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          reference_args=()
          if [ -n "$BASE_SHA" ]; then
            git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:apps/android/coverage-baseline.json" 2>/dev/null; then
            git show "$BASE_SHA:apps/android/coverage-baseline.json" > "$RUNNER_TEMP/android-coverage-baseline.json"
            reference_args=(--reference "$RUNNER_TEMP/android-coverage-baseline.json")
          fi
          python3 apps/android/scripts/coverage-ratchet.py \
            apps/android/app/build/reports/coverage/debug/coverage.xml \
            apps/android/coverage-baseline.json "${reference_args[@]}"
      - name: Publish Android coverage table
        if: always()
        run: |
          if [ -f apps/android/app/build/reports/coverage/debug/coverage.md ]; then
            cat apps/android/app/build/reports/coverage/debug/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-design-test-results
          retention-days: 7
          path: |
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
            apps/android/app/build/diagnostics/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/outputs/code_coverage/
            apps/android/app/build/reports/coverage/

  link-pr-apk:
    name: Link APK from PR
    needs: debug-apk
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Update APK download comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL: ${{ needs.debug-apk.outputs.artifact-url }}
          DEBUG_SIZE: ${{ needs.debug-apk.outputs.debug-size }}
          RELEASE_SIZE_REPORT: ${{ needs.debug-apk.outputs.release-size-report }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pull.head.sha !== process.env.HEAD_SHA) {
              core.notice('A newer commit is awaiting its APK build.');
              return;
            }
            const marker = '<!-- trustroots-pr-apk -->';
            const body = [
              marker,
              '## Android APK',
              '',
              `**[Download APK (ZIP)](${process.env.ARTIFACT_URL})**`,
              '',
              'Extract the ZIP and install `app-debug.apk`. It also contains the SHA-256 checksum.',
              '',
              `- **Debug APK size** · ${Number(process.env.DEBUG_SIZE).toLocaleString('en-GB')} bytes`,
              `- ${process.env.RELEASE_SIZE_REPORT}`,
              '',
              `Built from \`${process.env.HEAD_SHA.slice(0, 7)}\` after Android unit tests and lint passed. The download is retained for 30 days.`,
              '',
              `[Build details](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
