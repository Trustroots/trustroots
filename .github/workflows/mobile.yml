name: Mobile specs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile.yml'
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'openspec/changes/add-native-ios-member-mvp/**'
      - 'openspec/changes/add-native-android-member-mvp/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile.yml'
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'openspec/changes/add-native-ios-member-mvp/**'
      - 'openspec/changes/add-native-android-member-mvp/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Validate mobile contract
        run: |
          npm exec --yes --package=@fission-ai/openspec@1.6.0 -- \
            openspec validate add-native-ios-member-mvp --strict
          npm exec --yes --package=@fission-ai/openspec@1.6.0 -- \
            openspec validate add-native-android-member-mvp --strict
