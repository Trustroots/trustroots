name: Nostranslation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm nostranslation:typecheck
      - run: pnpm test:nostranslation --coverage
      - run: pnpm nostranslation:build
      - name: Build and smoke-test the standalone API image
        run: |
          docker build -f apps/nostranslation/Dockerfile -t nostranslation-ci .
          docker run --rm -i --network none nostranslation-ci node --input-type=module <<'JS'
          import { once } from 'node:events';
          import { createApp } from './apps/nostranslation/server/app.mts';
          import { Store } from './apps/nostranslation/server/store.mts';
          const store = new Store(':memory:');
          const app = createApp({ publicURL: 'http://127.0.0.1', origin: 'http://127.0.0.1' }, {}, store);
          const server = app.listen(0, '127.0.0.1');
          await once(server, 'listening');
          const response = await fetch(`http://127.0.0.1:${server.address().port}/health`);
          if (!response.ok || (await response.json()).status !== 'ok') throw new Error('API smoke test failed');
          await new Promise(resolve => server.close(resolve));
          store.close();
          JS
      - name: Validate changed translations
        if: github.event_name == 'pull_request'
        env:
          NOSTRANSLATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm nostranslation:check-translations
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:nostranslation:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nostranslation-test-results
          path: |
            coverage/nostranslation/
            test-results/
