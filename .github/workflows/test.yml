name: Tests

on:
  pull_request:
    branches: [main, 'codex/**', 'chore/**']
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_run:
    workflows: [Android preview release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_client:
        description: Run client tests
        type: boolean
        default: true
      run_server:
        description: Run server tests
        type: boolean
        default: true
      run_e2e:
        description: Run e2e tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  build-production-image:
    needs: changes
    if: >
      always() && !cancelled() && needs.changes.outputs.run-code != 'false' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build production image
        id: build-production
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: production.Dockerfile
          platforms: linux/amd64
          tags: trustroots:pr
          load: true
          cache-from: type=gha,scope=production
          # Cache availability must not fail a successful build or image push.
          cache-to: type=gha,ignore-error=true,mode=max,scope=production
          push: false
      - name: Inventory installed production dependencies
        run: |
          mkdir -p coverage/production
          docker run --rm -i --network none --entrypoint node trustroots:pr \
            --input-type=commonjs-typescript - --inventory-stdin < scripts/ci/production-dependencies.cts > coverage/production/dependencies.json
          test -s coverage/production/dependencies.json
      - name: Upload production dependency inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-dependencies
          path: coverage/production/dependencies.json
          if-no-files-found: error
      - name: Check production startup on MongoDB 4.4
        env:
          TRUSTROOTS_CI_MONGO_VERSION: '4.4'
        run: bash scripts/ci/check-production-startup.sh trustroots:pr
      - name: Check production startup on MongoDB 7.0
        if: ${{ !cancelled() && steps.build-production.outcome == 'success' }}
        env:
          TRUSTROOTS_CI_MONGO_VERSION: '7.0'
        run: bash scripts/ci/check-production-startup.sh trustroots:pr

  publish-production-image:
    needs: changes
    if: >
      always() && !cancelled() && needs.changes.outputs.run-code != 'false' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Set image tags
        id: image
        run: |
          echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PRODUCTION_USERNAME }}
          password: ${{ secrets.GHCR_PRODUCTION_TOKEN }}
      - name: Build and push production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: production.Dockerfile
          platforms: linux/amd64
          build-args: |
            TRUSTROOTS_BUILD_COMMIT=${{ github.sha }}
            TRUSTROOTS_BUILD_COMMITTED_AT=${{ github.event.head_commit.timestamp }}
            TRUSTROOTS_BUILD_BRANCH=${{ github.ref_name }}
          tags: |
            ghcr.io/trustrootsops/trustroots:latest
            ghcr.io/trustrootsops/trustroots:git-${{ steps.image.outputs.short-sha }}
          cache-from: type=gha,scope=production
          # Cache availability must not fail a successful build or image push.
          cache-to: type=gha,ignore-error=true,mode=max,scope=production
          push: true

  build-dev-image:
    needs: changes
    if: >
      always() && !cancelled() && needs.changes.outputs.run-code != 'false' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Set image reference
        id: image
        run: |
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}/trustroots-dev:${GITHUB_SHA}"
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/dev.Dockerfile
          target: dev
          tags: ${{ steps.image.outputs.image-ref }}
          cache-from: type=gha
          # Cache availability must not fail a successful build or image push.
          cache-to: type=gha,ignore-error=true,mode=max
          push: true

  client:
    needs: changes
    if: >
      github.event_name != 'workflow_run' &&
      always() && !cancelled() && needs.changes.outputs.run-code != 'false' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: true
      TRUSTROOTS_SKIP_LOCAL_CONFIG: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check internal client links
        run: pnpm run test:links && pnpm run check:links
      - name: Type-check client TypeScript
        run: pnpm run typecheck
      - name: Test native promise script flows
        run: pnpm run test:promise-flows
      - name: Test Vite RTL stylesheet and development scripts
        run: pnpm run test:vite:rtl
      - name: Build Vite client assets
        run: pnpm run build:vite
      - name: Install Chromium for Vite smoke tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-test Vite production script loading
        run: pnpm run test:vite:production
      - name: Smoke-test Vite development proxy and module loading
        run: pnpm run test:vite:development
      - name: Test client with coverage
        run: |
          mkdir -p coverage/client
          started_at="$(date +%s%3N)"
          exit_code=0
          set +e
          NODE_ENV=test pnpm run test:coverage:client:ci
          exit_code="$?"
          if [ "$exit_code" -eq 0 ]; then
            pnpm run coverage:check --scope=client
            exit_code="$?"
          fi
          set -e
          finished_at="$(date +%s%3N)"
          duration_ms="$((finished_at - started_at))"
          status="passed"
          message="Client coverage completed successfully."
          if [ "$exit_code" -ne 0 ]; then
            status="failed"
            message="Client coverage failed."
          fi
          STATUS="$status" EXIT_CODE="$exit_code" DURATION_MS="$duration_ms" MESSAGE="$message" \
          COMMAND="pnpm run test:coverage:client:ci && pnpm run coverage:check --scope=client" \
          node - <<'NODE'
          const fs = require('fs');
          const status = {
            status: process.env.STATUS,
            exitCode: Number(process.env.EXIT_CODE),
            message: process.env.MESSAGE,
            generatedAt: new Date().toISOString(),
            command: process.env.COMMAND,
            durationMs: Number(process.env.DURATION_MS),
          };
          fs.writeFileSync('coverage/client/coverage-status.json', `${JSON.stringify(status, null, 2)}\n`);
          NODE
          exit "$exit_code"
      - name: Upload client coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-client
          path: coverage/client
          if-no-files-found: ignore

  server-tests:
    name: Server (MongoDB ${{ matrix.mongodb }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongodb: '4.4'
            shell: mongo
          - mongodb: '7.0'
            shell: mongosh
    needs: changes
    if: >
      github.event_name != 'workflow_run' &&
      always() && !cancelled() && needs.changes.outputs.run-code != 'false' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: true
      NODE_ENV: test
      DB_1_PORT_27017_TCP_ADDR: 127.0.0.1
      TRUSTROOTS_SKIP_LOCAL_CONFIG: true
      TRUSTROOTS_AVATAR_PROCESSOR_FALLBACK: true
      TRUSTROOTS_FILE_MAGIC_FALLBACK: true
      SERVER_TEST_WORKERS: 4
      SERVER_TEST_TIMINGS_DIR: coverage/server-timings
    services:
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        ports:
          - 27017:27017
        options: >-
          --tmpfs /data/db
          --health-cmd "${{ matrix.shell }} --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Test production deployment safeguards
        run: python3 deploy/docker/test-production-deploy.py
      - name: Restore server test durations
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coverage/server-timings
          key: ${{ runner.os }}-server-timings-mongo-${{ matrix.mongodb }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-server-timings-mongo-${{ matrix.mongodb }}-v1-
      # Record access route tests are included in the full server suite below.
      - name: Test server with coverage
        run: |
          mkdir -p coverage/server
          started_at="$(date +%s%3N)"
          exit_code=0
          set +e
          pnpm run test:coverage:server:parallel
          exit_code="$?"
          if [ "$exit_code" -eq 0 ]; then
            pnpm run coverage:check --scope=server --require-full
            exit_code="$?"
          fi
          set -e
          finished_at="$(date +%s%3N)"
          duration_ms="$((finished_at - started_at))"
          status="passed"
          message="Server coverage completed successfully."
          if [ "$exit_code" -ne 0 ]; then
            status="failed"
            message="Server coverage failed."
          fi
          STATUS="$status" EXIT_CODE="$exit_code" DURATION_MS="$duration_ms" MESSAGE="$message" \
          COMMAND="pnpm run test:coverage:server:parallel && pnpm run coverage:check --scope=server --require-full" \
          node - <<'NODE'
          const fs = require('fs');
          const status = {
            status: process.env.STATUS,
            exitCode: Number(process.env.EXIT_CODE),
            message: process.env.MESSAGE,
            generatedAt: new Date().toISOString(),
            command: process.env.COMMAND,
            durationMs: Number(process.env.DURATION_MS),
          };
          fs.writeFileSync('coverage/server/coverage-status.json', `${JSON.stringify(status, null, 2)}\n`);
          NODE
          exit "$exit_code"
      - name: Upload server coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.mongodb == '4.4' && 'coverage-server' || 'coverage-server-mongo-7.0' }}
          path: coverage/server
          if-no-files-found: ignore

  # Stable required check: both database versions must pass.
  server:
    needs: [changes, server-tests]
    if: >
      always() && github.event_name != 'workflow_run' &&
      needs.changes.outputs.run-code != 'false' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_server)
    runs-on: ubuntu-latest
    steps:
      - name: Require both MongoDB server suites
        env:
          RESULT: ${{ needs.server-tests.result }}
        run: test "$RESULT" = success

  build-e2e-assets:
    needs: changes
    if: >
      github.event_name != 'workflow_run' &&
      always() && !cancelled() && needs.changes.outputs.run-code != 'false' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      TRUSTROOTS_SKIP_LOCAL_CONFIG: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build shared end-to-end assets
        run: pnpm run build:e2e
      - name: Upload end-to-end assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-assets
          path: public/assets
          if-no-files-found: error

  e2e-groups:
    name: E2E ${{ matrix.group }} (MongoDB ${{ matrix.mongodb }})
    env:
      TRUSTROOTS_CI_MONGO_VERSION: ${{ matrix.mongodb }}
    needs: [changes, build-dev-image, build-e2e-assets]
    if: >
      github.event_name != 'workflow_run' &&
      always() && !cancelled() && needs.changes.outputs.run-code != 'false' &&
      needs.build-e2e-assets.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_e2e) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'pull_request'
      ) &&
      (needs.build-dev-image.result == 'success' || needs.build-dev-image.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        group: [account-public, community, admin-search]
        mongodb: ['4.4', '7.0']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        if: needs.build-dev-image.result == 'skipped'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: needs.build-dev-image.result == 'success'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dev image
        if: needs.build-dev-image.result == 'skipped'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/dev.Dockerfile
          target: dev
          tags: trustroots-dev:ci
          cache-from: type=gha
          # Cache availability must not fail a successful build or image push.
          cache-to: type=gha,ignore-error=true,mode=max
          load: true
      - name: Download shared end-to-end assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: e2e-assets
          path: public/assets
      - name: Prepare compose local config
        run: node ./scripts/ci/ensure-compose-local.cts
      - name: Prepare end-to-end containers
        env:
          TRUSTROOTS_CI_DEV_IMAGE: ${{ needs.build-dev-image.outputs.image-ref }}
        run: bash scripts/ci/prepare-e2e-containers.sh
      - name: Test end-to-end group
        working-directory: deploy/docker
        run: |
          export TRUSTROOTS_BUILD_COMMIT="$(git rev-parse HEAD)"
          export TRUSTROOTS_BUILD_COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          export TRUSTROOTS_BUILD_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          # Read metadata on the runner; container Git can reject checkout ownership.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm \
            -e CI=true \
            -e NODE_ENV=test \
            -e DB_1_PORT_27017_TCP_ADDR=mongodb \
            -e TRUSTROOTS_SKIP_LOCAL_CONFIG=true \
            -e TRUSTROOTS_AVATAR_PROCESSOR_FALLBACK=true \
            -e TRUSTROOTS_FILE_MAGIC_FALLBACK=true \
            -e TRUSTROOTS_E2E_MONGO_URI=mongodb://mongodb:27017/trustroots-test \
            -e TRUSTROOTS_E2E_SKIP_WEB_BUILD=true \
            -e TRUSTROOTS_E2E_GROUP=${{ matrix.group }} \
            -e TRUSTROOTS_E2E_ALLOW_PARTIAL_FEATURE_COVERAGE=true \
            -e TRUSTROOTS_E2E_WORKERS=2 \
            -e TRUSTROOTS_E2E_SERIAL_PROJECTS=true \
            -e TRUSTROOTS_E2E_SKIP_JS_COVERAGE=true \
            -e TRUSTROOTS_BUILD_COMMIT \
            -e TRUSTROOTS_BUILD_COMMITTED_AT \
            -e TRUSTROOTS_BUILD_BRANCH \
            dev pnpm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.group }}-mongo-${{ matrix.mongodb }}
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload e2e coverage status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-e2e-${{ matrix.group }}-mongo-${{ matrix.mongodb }}
          path: coverage/e2e
          if-no-files-found: ignore
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-test-results-${{ matrix.group }}-mongo-${{ matrix.mongodb }}
          path: test-results
          if-no-files-found: ignore

  e2e-results:
    name: E2E coverage (MongoDB ${{ matrix.mongodb }})
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['4.4', '7.0']
    needs: [changes, build-e2e-assets, e2e-groups]
    if: >
      github.event_name != 'workflow_run' &&
      always() && !cancelled() &&
      (needs.e2e-groups.result != 'skipped' || needs.build-e2e-assets.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download group results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-e2e-*-mongo-${{ matrix.mongodb }}
          path: coverage/e2e/groups
      - name: Download group HTML reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: playwright-report-*-mongo-${{ matrix.mongodb }}
          path: playwright-report
      - name: Normalise group report directories
        env:
          MONGO_VERSION: ${{ matrix.mongodb }}
        run: |
          for directory in coverage/e2e/groups/*-mongo-"$MONGO_VERSION" playwright-report/*-mongo-"$MONGO_VERSION"; do
            [ -d "$directory" ] || continue
            mv "$directory" "${directory%-mongo-$MONGO_VERSION}"
          done
      - name: Enforce complete combined e2e coverage
        env:
          TRUSTROOTS_E2E_GROUP_JOB_RESULT: ${{ needs.e2e-groups.result }}
        run: node scripts/e2e/aggregate-results.js
      - name: Upload combined e2e status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.mongodb == '4.4' && 'coverage-e2e' || 'coverage-e2e-mongo-7.0' }}
          path: coverage/e2e
          if-no-files-found: error
      - name: Upload combined report index
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.mongodb == '4.4' && 'playwright-report' || 'playwright-report-mongo-7.0' }}
          path: playwright-report
          if-no-files-found: error

  # Stable required check: every group and each version's coverage must pass.
  e2e:
    needs: [changes, build-e2e-assets, e2e-groups, e2e-results]
    if: >
      always() && github.event_name != 'workflow_run' &&
      needs.changes.outputs.run-code != 'false' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Require both MongoDB end-to-end suites
        env:
          BUILD_RESULT: ${{ needs.build-e2e-assets.result }}
          GROUP_RESULT: ${{ needs.e2e-groups.result }}
          COVERAGE_RESULT: ${{ needs.e2e-results.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$GROUP_RESULT" = success
          test "$COVERAGE_RESULT" = success

  coverage-summary:
    if: always() && !cancelled() && github.event_name == 'pull_request'
    needs: [changes, client, server, e2e, build-production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch comparison history
        run: python3 scripts/ci/fetch-comparison.py
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Download production dependency inventory
        if: needs.build-production-image.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: production-dependencies
          path: coverage/production
      - name: Download client coverage
        if: needs.changes.outputs.run-code != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: coverage-client
          path: coverage/client
      - name: Download server coverage
        if: needs.changes.outputs.run-code != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: coverage-server
          path: coverage/server
      - name: Download end-to-end status
        if: needs.changes.outputs.run-code != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: coverage-e2e
          path: coverage/e2e
      - name: Download Playwright report
        if: needs.changes.outputs.run-code != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report
      - name: Record skipped end-to-end status
        if: needs.changes.outputs.run-code != 'false' && needs.e2e.result == 'skipped'
        run: |
          mkdir -p coverage/e2e
          node -e "const fs = require('fs'); const status = { status: 'skipped', exitCode: 0, message: 'End-to-end tests were not requested for this pull request run.', generatedAt: new Date().toISOString(), command: 'pnpm run test:e2e', reportPath: 'playwright-report/index.html', metrics: null }; fs.writeFileSync('coverage/e2e/status.json', JSON.stringify(status, null, 2) + '\n');"
      - name: Collect CI timing snapshot
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { collectTimings } = require('./scripts/coverage/collect-ci-timings.cts');
            const timings = await collectTimings(github, context, Number(process.env.GITHUB_RUN_ATTEMPT));
            fs.mkdirSync('coverage', { recursive: true });
            fs.writeFileSync('coverage/ci-timings.json', JSON.stringify(timings, null, 2));
      - name: Generate coverage overview
        if: needs.changes.outputs.run-code != 'false'
        run: node scripts/coverage/generate-report.cts
      - name: Generate pull request summary
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTROOTS_PR_INCLUDE_COVERAGE: ${{ needs.changes.outputs.run-code != 'false' }}
        run: |
          mkdir -p coverage-report
          node scripts/coverage/generate-pr-summary.cts > coverage-report/pr-summary.md
          cat coverage-report/pr-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage overview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-report
      - name: Update pull request coverage comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- trustroots-coverage-report -->';
            const body = fs.readFileSync('coverage-report/pr-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: latest } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (latest.head.sha !== context.payload.pull_request.head.sha) {
              core.info('Skipping a summary for an outdated PR head.');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Require full client and server coverage
        if: needs.changes.outputs.run-code != 'false'
        run: node scripts/coverage/check-coverage.cts --require-full

  pages:
    if: >
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    # Serialize all GitHub Pages deployments (across runs and the two deploy
    # jobs below) so actions/deploy-pages does not fail with "Deployment
    # failed, try again later." when deployments to this environment overlap.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://team.trustroots.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Refresh Android download versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/build-docs-scripts.mts
          node scripts/ci/android-release-metadata.mts
      - name: Build docs site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: Restore previous coverage report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r _site site
          mkdir -p site/coverage
          artifact_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=coverage-report&per_page=100" \
            --jq 'first(.artifacts[] | select(.expired == false)).id // empty' || true)
          if [ -n "$artifact_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > coverage-report.zip || true
            unzip -q -o coverage-report.zip -d site/coverage || true
          fi
          if [ ! -s site/coverage/index.html ]; then
            cat > site/coverage/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Trustroots Coverage Report</title>
            <p>No coverage report is available yet.</p>
            <p>
              The report is generated by GitHub Actions after tests pass on the
              main branch, and the previous report is restored from build
              artifacts. If this message persists, there may not have been a
              successful run in the last 90 days (artifacts expire after that).
            </p>
            <p><a href="/">Team home</a></p>
          </html>
          HTML
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Build Nostranslation for the team site
        env:
          VITE_NOSTRANSLATION_API_URL: ${{ vars.NOSTRANSLATION_API_URL || 'https://nostranslation-api.trustroots.org' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run nostranslation:build
          mkdir -p site/nostranslation
          cp -r apps/nostranslation/build/. site/nostranslation/
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-docs-${{ github.run_id }}-${{ github.run_attempt }}

  pages-coverage:
    if: >
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.client.result == 'success' &&
      needs.server.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    needs: [client, server, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://team.trustroots.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Download client coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-client
          path: coverage/client
      - name: Download server coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-server
          path: coverage/server
      - name: Download e2e coverage status
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: coverage-e2e
          path: coverage/e2e
      - name: Download Playwright report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report
      - name: Collect CI timing snapshot
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { collectTimings } = require('./scripts/coverage/collect-ci-timings.cts');
            const timings = await collectTimings(github, context, Number(process.env.GITHUB_RUN_ATTEMPT));
            fs.mkdirSync('coverage', { recursive: true });
            fs.writeFileSync('coverage/ci-timings.json', JSON.stringify(timings, null, 2));
      - name: Generate coverage report page
        run: node scripts/coverage/generate-report.cts
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Refresh Android download versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/build-docs-scripts.mts
          node scripts/ci/android-release-metadata.mts
      - name: Build docs site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: Add coverage report to site
        run: |
          cp -r _site site
          mkdir -p site/coverage
          cp -r coverage-report/. site/coverage/
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Build Nostranslation for the team site
        env:
          VITE_NOSTRANSLATION_API_URL: ${{ vars.NOSTRANSLATION_API_URL || 'https://nostranslation-api.trustroots.org' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run nostranslation:build
          mkdir -p site/nostranslation
          cp -r apps/nostranslation/build/. site/nostranslation/
      - name: Upload site with coverage
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Deploy site with coverage
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-report
