name: Linter

on:
  pull_request:
    branches: [main, 'codex/**', 'chore/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-apps:
    name: Check Android download pages
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - run: node scripts/ci/build-docs-scripts.mts
      - run: node --test scripts/ci/latest-apk.test.mts scripts/ci/zapstore-publisher.test.mts
      - name: Check whether docs browser tests are needed
        id: browser
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet FETCH_HEAD HEAD -- docs scripts/android scripts/ci/latest-apk.test.mts scripts/ci/zapstore-publisher.test.mts scripts/ci/android-release-metadata.mts scripts/ci/docs-playwright.config.mts scripts/ci/build-docs-scripts.mts tooling/tsconfig/docs.json tooling/tsconfig/base.json tests/docs .github/workflows/lint.yml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.browser.outputs.run == 'true'
      - name: Install docs browser test dependencies
        if: steps.browser.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        if: steps.browser.outputs.run == 'true'
        run: pnpm exec playwright install chromium
      - name: Test browser publishing
        if: steps.browser.outputs.run == 'true'
        run: pnpm exec playwright test --config scripts/ci/docs-playwright.config.mts

  changes:
    uses: ./.github/workflows/ci-changes.yml

  lint:
    needs: changes
    if: >
      always() && !cancelled() && needs.changes.outputs.run-code != 'false'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts --prefer-offline && break

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 30
          done
      - name: Lint
        id: lint
        # The github format annotates the pull request and fails on errors.
        run: pnpm run lint:report
      - name: Check formatting
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        run: pnpm exec oxfmt --check
      - name: Check API input and request origins
        run: pnpm run test:boundaries
      - name: Check formatted content boundaries
        run: pnpm run test:content

  module-graph:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.run-code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts --prefer-offline && break

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 30
          done
      - name: Check module graph
        run: |
          pnpm run test:affected
          pnpm run lint:boundaries:test
          pnpm run lint:boundaries
          pnpm run lint:modules:test
          pnpm run lint:modules
          pnpm run lint:packages:test
          pnpm run lint:packages
