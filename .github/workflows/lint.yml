name: Linter

on:
  pull_request:
    branches: [main, 'codex/**', 'chore/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-apps:
    name: Check Android download pages
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - run: node scripts/ci/build-docs-scripts.mts
      - run: node --test scripts/ci/latest-apk.test.mts scripts/ci/zapstore-publisher.test.mts
      - name: Check whether docs browser tests are needed
        id: browser
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet FETCH_HEAD HEAD -- docs scripts/android scripts/ci/latest-apk.test.mts scripts/ci/zapstore-publisher.test.mts scripts/ci/android-release-metadata.mts scripts/ci/docs-playwright.config.mts scripts/ci/build-docs-scripts.mts tsconfig.docs.json tests/docs .github/workflows/lint.yml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.browser.outputs.run == 'true'
      - name: Install docs browser test dependencies
        if: steps.browser.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        if: steps.browser.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Test browser publishing
        if: steps.browser.outputs.run == 'true'
        run: pnpm exec playwright test --config scripts/ci/docs-playwright.config.mts

  changes:
    uses: ./.github/workflows/ci-changes.yml

  lint:
    needs: changes
    if: >
      always() && !cancelled() && needs.changes.outputs.run-code != 'false'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts --prefer-offline \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=20000 \
              --fetch-retry-maxtimeout=120000 \
              --fetch-timeout=600000 && break

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 30
          done
      - name: Lint
        id: lint
        # See https://eslint.org/docs/user-guide/command-line-interface#options
        run: pnpm run lint:report
        # Continue to the next step even if this fails
        continue-on-error: true
      - name: Set up reviewdog
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: reviewdog/action-setup@ece8286927ac882f28d3dee979d6d93babd197b2 # v1
        continue-on-error: true
        with:
          reviewdog_version: v0.21.2
      - name: Annotate existing ESLint results
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODE' > eslint_report.txt
          const fs = require('node:fs');
          const { ESLint } = require('eslint');
          (async () => {
            const formatter = await new ESLint().loadFormatter('stylish');
            process.stdout.write(formatter.format(JSON.parse(fs.readFileSync('eslint_report.json', 'utf8'))));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          reviewdog -f=eslint -name=eslint -reporter=github-check \
            -filter-mode=file -fail-level=none < eslint_report.txt
      - name: Enforce lint
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: test "$LINT_OUTCOME" = success
      - name: Check API input and request origins
        run: pnpm run test:boundaries
      - name: Check formatted content boundaries
        run: pnpm run test:content
      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eslint_report.json
          path: eslint_report.json

  module-graph:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.run-code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts --prefer-offline \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=20000 \
              --fetch-retry-maxtimeout=120000 \
              --fetch-timeout=600000 && break

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 30
          done
      - name: Check module graph
        run: |
          pnpm run test:affected
          pnpm run lint:boundaries:test
          pnpm run lint:boundaries
          pnpm run lint:modules:test
          pnpm run lint:modules
          pnpm run lint:packages:test
          pnpm run lint:packages
