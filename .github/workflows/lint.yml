name: Linter

on:
  pull_request:
    branches: [main, 'codex/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  lint:
    # Don't run inline ESlint test if PR is from a forked repo (i.e. it doesn't have read permission)
    # See https://github.com/ataylorme/eslint-annotate-action/issues/28
    needs: changes
    if: >
      always() && !cancelled() && needs.changes.outputs.run-code != 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Pin npm to v11
        run: npm i -g npm@11.19.0
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts --prefer-offline --no-audit \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=20000 \
              --fetch-retry-maxtimeout=120000 \
              --fetch-timeout=600000 && break

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 30
          done
      - name: Lint
        # See https://eslint.org/docs/user-guide/command-line-interface#options
        run: npm run lint:report
        # Continue to the next step even if this fails
        continue-on-error: true
      - name: Run ESLint with reviewdog
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1.34.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          filter_mode: file # annotate all issues in changed files (mirrors old only-pr-files)
          fail_level: error # fail the check on ESLint errors (warnings still reported)
          eslint_flags: '--ext .js,.mjs,.ts,.tsx .'
      - name: Upload ESLint report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eslint_report.json
          path: eslint_report.json
