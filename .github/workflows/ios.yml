name: iOS

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'apps/shared/**'
      - 'apps/android/build.gradle.kts'
      - 'apps/android/settings.gradle.kts'
      - 'apps/android/gradle/**'
      - 'apps/android/gradle.properties'
      - 'openspec/changes/add-native-ios-member-mvp/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'apps/shared/**'
      - 'apps/android/build.gradle.kts'
      - 'apps/android/settings.gradle.kts'
      - 'apps/android/gradle/**'
      - 'apps/android/gradle.properties'
      - 'openspec/changes/add-native-ios-member-mvp/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      minimum_ios:
        description: Run on iOS 17.0, the minimum deployment target
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Kotlin-compatible Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Select an iPhone simulator
        id: simulator
        shell: bash
        env:
          TEST_MINIMUM_IOS: ${{ inputs.minimum_ios }}
        run: |
          if [[ "$TEST_MINIMUM_IOS" == true ]]; then
            runtime_id=com.apple.CoreSimulator.SimRuntime.iOS-17-0
            runtime_available() {
              xcrun simctl list runtimes -j | jq -e --arg id "$runtime_id" \
                'any(.runtimes[]; .identifier == $id and .isAvailable)' >/dev/null
            }
            if ! runtime_available; then
              xcodebuild -downloadPlatform iOS -buildVersion 17.0
            fi
            if ! runtime_available; then
              xcrun simctl list runtimes
              echo "::error::The exact iOS 17.0 simulator runtime is unavailable."
              exit 1
            fi
            device_id="$(xcrun simctl create 'Trustroots iOS 17.0' \
              com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$runtime_id")"
          else
            device_id="$(bash apps/ios/scripts/select-ci-simulator.sh)"
          fi
          test -n "$device_id"
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Compile arm64 iOS device framework
        working-directory: apps/android
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64
      - name: Run shared Kotlin contract tests
        working-directory: apps/android
        run: ./gradlew :shared:iosSimulatorArm64Test --device '${{ steps.simulator.outputs.id }}'
      - name: Test coverage reporting scripts
        run: python3 apps/ios/scripts/test_coverage_summary.py
      - name: Run iOS tests
        working-directory: apps/ios
        env:
          TRUSTROOTS_IOS_PILOT_PORT: 18765
        run: |
          python3 scripts/shared_member_pilot_server.py --port "$TRUSTROOTS_IOS_PILOT_PORT" &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$TRUSTROOTS_IOS_PILOT_PORT/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$TRUSTROOTS_IOS_PILOT_PORT/health" >/dev/null
          xcodebuild \
            -project Trustroots.xcodeproj \
            -scheme TrustrootsTests \
            -destination 'id=${{ steps.simulator.outputs.id }}' \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/TrustrootsTests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            test
      - name: Extract and publish coverage summary
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/TrustrootsTests.xcresult"
          if [ ! -d "$result_bundle" ]; then
            echo "No result bundle at $result_bundle; skipping coverage extraction."
            exit 0
          fi
          mkdir -p apps/ios/build/coverage
          xcrun xccov view --report --json "$result_bundle" \
            > apps/ios/build/coverage/xccov-report.json
          python3 apps/ios/scripts/coverage-summary.py \
            apps/ios/build/coverage/xccov-report.json \
            --markdown apps/ios/build/coverage/coverage.md \
            --json-out apps/ios/build/coverage/coverage-summary.json
          cat apps/ios/build/coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload iOS coverage artefacts
        if: always() && !cancelled() && hashFiles('apps/ios/build/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-coverage
          path: |
            apps/ios/build/coverage/coverage-summary.json
            apps/ios/build/coverage/coverage.md
            apps/ios/build/coverage/xccov-report.json
          if-no-files-found: error
      - name: Export Compose offline screenshot
        if: github.event_name == 'pull_request'
        run: |
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/TrustrootsTests.xcresult" \
            --output-path "$RUNNER_TEMP/compose-offline-screenshots" \
            --test-id 'SharedMemberPilotJourneyUITests/testShowsSavedProfileAndClearsOfflineBannerAfterLiveRequest()'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'pull_request'
        with:
          name: ios-compose-offline-screenshot
          path: ${{ runner.temp }}/compose-offline-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload iOS test results and section screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/TrustrootsTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ios-coverage:
    name: iOS coverage
    needs: ios
    runs-on: ubuntu-latest
    if: always() && needs.ios.result == 'success'
    steps:
      - name: Download iOS coverage summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-coverage
          path: ios-coverage
      - name: Require and republish coverage summary
        run: |
          set -euo pipefail
          test -s ios-coverage/coverage-summary.json
          test -s ios-coverage/coverage.md
          {
            echo "## iOS coverage"
            echo ""
            cat ios-coverage/coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("ios-coverage/coverage-summary.json").read_text())
          lines = summary["lines"]
          covered, total = lines["covered"], lines["total"]
          ratio = "—" if total <= 0 else f"{covered}/{total} ({covered / total:.1%})"
          print(f"Application line coverage: {ratio}")
          print(f"Targets reported: {len(summary.get('targets') or [])}")
          PY
