name: iOS

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'apps/shared/**'
      - 'apps/android/build.gradle.kts'
      - 'apps/android/settings.gradle.kts'
      - 'apps/android/gradle/**'
      - 'apps/android/gradle.properties'
      - 'openspec/changes/add-native-ios-member-mvp/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'apps/shared/**'
      - 'apps/android/build.gradle.kts'
      - 'apps/android/settings.gradle.kts'
      - 'apps/android/gradle/**'
      - 'apps/android/gradle.properties'
      - 'openspec/changes/add-native-ios-member-mvp/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Kotlin-compatible Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Compile arm64 iOS device framework
        working-directory: apps/android
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64
      - name: Select an iPhone simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | ruby -rjson -e '
            JSON.parse($stdin.read).fetch("devices").each_value do |devices|
              iphone = devices.find { |device| device.fetch("name").start_with?("iPhone") }
              if iphone
                puts iphone.fetch("udid")
                break
              end
            end
          ')"
          test -n "$device_id"
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run iOS tests
        working-directory: apps/ios
        run: >-
          xcodebuild
          -project Trustroots.xcodeproj
          -scheme TrustrootsTests
          -destination 'id=${{ steps.simulator.outputs.id }}'
          CODE_SIGNING_ALLOWED=NO
          test
