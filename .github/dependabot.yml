version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Babel major upgrades need a coordinated loader, lint and extractor migration.
    ignore:
      - dependency-name: '@babel/*'
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Base images are pinned to exact tags; this keeps those pins on current patches.
  - package-ecosystem: docker
    directories:
      - /
      - /apps/nostranslation
      - /deploy/docker
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Node majors move together with .nvmrc and the workflows, so they stay manual.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
